step = "P0.22"
dir = "P2.11"
enable = "P0.21"
uart = "P1.08"
diag = "P1.27 Z-STOP"

[canales.E0]
orden = 4
activo = true
secuencia = "vacio"
modelo = "SY42STH38-1684A"
nota = "Mismo motor que Z. Este canal es E0: herramienta T0 y letra E."
letra = "E"
herramienta = 0
corriente_nominal_ma = 1680
corriente_ma = 800
pasos_por_mm = 95
micropasos = 16
grados_por_paso = 1.8
sentido = 1
